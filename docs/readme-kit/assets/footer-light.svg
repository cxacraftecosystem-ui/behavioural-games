<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-label="A measurement instrument first, a game second. SHRIII, Kiosk Behavioural Games.">
<title>A measurement instrument first, a game second. SHRIII, Kiosk Behavioural Games.</title>
<defs>
<style>.d{font-family:'Plus Jakarta Sans','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.s{font-family:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.m{font-family:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.wa{animation:wave 10s ease-in-out infinite alternate}.wv{animation:wave 14s ease-in-out infinite alternate-reverse}@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-150px)}}.spark{opacity:0;animation:spark 6s ease-in-out infinite}@keyframes spark{0%{opacity:0;transform:translateY(0)}30%{opacity:.9}100%{opacity:0;transform:translateY(-60px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.smil{display:none}.sweep{fill:url(#still)}}</style>
<linearGradient id="fb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F1FA"/></linearGradient>
<linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#762CB1"/><stop offset=".5" stop-color="#CD9200"/><stop offset="1" stop-color="#762CB1"/></linearGradient>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4B1674"/><stop offset="0.25" stop-color="#762CB1"/><stop offset="0.5" stop-color="#9148D2"/><stop offset="0.75" stop-color="#AD7300"/><stop offset="1" stop-color="#4B1674"/><animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="9s" repeatCount="indefinite"/></linearGradient><linearGradient id="still" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4B1674"/><stop offset="1" stop-color="#762CB1"/></linearGradient>
<clipPath id="c"><rect width="1200" height="210" rx="22"/></clipPath>
</defs>
<g clip-path="url(#c)">
<rect width="1200" height="210" fill="url(#fb)"/>
<path class="wv" opacity="0.18" fill="url(#wave)" d="M0 140 C 150 104 300 176 450 140 S 750 104 900 140 S 1200 176 1350 140 V210 H0Z"/>
<path class="wa" opacity="0.28" fill="url(#wave)" d="M0 168 C 160 134 320 198 480 168 S 800 134 960 168 S 1280 198 1400 168 V210 H0Z"/>
<circle class="spark" style="animation-delay:0s" cx="140" cy="150" r="2.6" fill="#CD9200"/><circle class="spark" style="animation-delay:-2s" cx="260" cy="120" r="2" fill="#AA69E9"/><circle class="spark" style="animation-delay:-4s" cx="420" cy="160" r="2.6" fill="#AA69E9"/><circle class="spark" style="animation-delay:-1s" cx="780" cy="140" r="2" fill="#CD9200"/><circle class="spark" style="animation-delay:-3s" cx="940" cy="118" r="2.6" fill="#AA69E9"/><circle class="spark" style="animation-delay:-5s" cx="1080" cy="156" r="2" fill="#AA69E9"/>
<text x="600" y="74" class="d sweep" fill="url(#sweep)" font-size="32" font-weight="800" text-anchor="middle" letter-spacing="-.6">A measurement instrument first, a game second.</text>
<text x="600" y="106" class="m" fill="#615D7A" font-size="14" text-anchor="middle" letter-spacing=".4">SHRIII · Kiosk Behavioural Games</text>
<rect x=".5" y=".5" width="1199" height="209" rx="22" fill="none" stroke="#E4E2EF"/>
</g>
</svg>
