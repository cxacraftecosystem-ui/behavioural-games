<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="244" viewBox="0 0 1200 244" role="img" aria-label="Build so far: plan and wave 1, wave 2, the live pilot, hardening, the t3.small host, then Stage 1 in the field">
<title>Build so far: plan and wave 1, wave 2, the live pilot, hardening, the t3.small host, then Stage 1 in the field</title>
<defs>
<style>.d{font-family:'Plus Jakarta Sans','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.s{font-family:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.m{font-family:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.prog{stroke-dasharray:784;stroke-dashoffset:0;animation:prog 2.4s cubic-bezier(.4,0,.2,1) .2s both}@keyframes prog{from{stroke-dashoffset:784}to{stroke-dashoffset:0}}.halo{animation:halo 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes halo{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.8);opacity:0}}.ahead{stroke-dasharray:2 10}.r0{animation-delay:0.1s}.r1{animation-delay:0.3s}.r2{animation-delay:0.4s}.r3{animation-delay:0.6s}.r4{animation-delay:0.7s}.r5{animation-delay:0.9s}@media (prefers-reduced-motion:reduce){*{animation:none!important}.smil{display:none}.sweep{fill:url(#still)}}</style>
<linearGradient id="pg" gradientUnits="userSpaceOnUse" x1="110" y1="0" x2="894" y2="0"><stop offset="0" stop-color="#C090F5"/><stop offset="1" stop-color="#AA69E9"/></linearGradient>
</defs>
<path class="ahead" d="M70 112 H1130" stroke="#3A3350" stroke-width="3" stroke-linecap="round" fill="none"/>
<path class="prog" d="M110 112 H894" stroke="url(#pg)" stroke-width="4" stroke-linecap="round" fill="none"/>
<g class="rise r0">
<text x="110" y="82" class="m" fill="#D6B6FB" font-size="12" font-weight="600" letter-spacing="1.2" text-anchor="middle">21 OCT</text>

<circle cx="110" cy="112" r="8" fill="#1A1725" stroke="#C090F5" stroke-width="3"/>
<text x="110" y="156" class="d" fill="#F2F0F9" font-size="16" font-weight="700" text-anchor="middle">Plan + wave 1</text>
<text x="110" y="179" class="s" fill="#9E98B2" font-size="13" text-anchor="middle">Contracts, engine, API</text>
</g>
<g class="rise r1">
<text x="306" y="82" class="m" fill="#D6B6FB" font-size="12" font-weight="600" letter-spacing="1.2" text-anchor="middle">22 OCT</text>

<circle cx="306" cy="112" r="8" fill="#1A1725" stroke="#C090F5" stroke-width="3"/>
<text x="306" y="156" class="d" fill="#F2F0F9" font-size="16" font-weight="700" text-anchor="middle">Wave 2</text>
<text x="306" y="179" class="s" fill="#9E98B2" font-size="13" text-anchor="middle">Both pathways end to end</text>
</g>
<g class="rise r2">
<text x="502" y="82" class="m" fill="#D6B6FB" font-size="12" font-weight="600" letter-spacing="1.2" text-anchor="middle">22 OCT</text>

<circle cx="502" cy="112" r="8" fill="#1A1725" stroke="#C090F5" stroke-width="3"/>
<text x="502" y="156" class="d" fill="#F2F0F9" font-size="16" font-weight="700" text-anchor="middle">Live pilot</text>
<text x="502" y="179" class="s" fill="#9E98B2" font-size="13" text-anchor="middle">Vercel, EC2, Supabase</text>
</g>
<g class="rise r3">
<text x="698" y="82" class="m" fill="#D6B6FB" font-size="12" font-weight="600" letter-spacing="1.2" text-anchor="middle">1 NOV</text>

<circle cx="698" cy="112" r="8" fill="#1A1725" stroke="#C090F5" stroke-width="3"/>
<text x="698" y="156" class="d" fill="#F2F0F9" font-size="16" font-weight="700" text-anchor="middle">Hardening</text>
<text x="698" y="179" class="s" fill="#9E98B2" font-size="13" text-anchor="middle">Dependabot, pinned actions</text>
</g>
<g class="rise r4">
<text x="894" y="82" class="m" fill="#D6B6FB" font-size="12" font-weight="600" letter-spacing="1.2" text-anchor="middle">2 NOV</text>
<circle class="halo" cx="894" cy="112" r="10" fill="#C090F5"/>
<circle cx="894" cy="112" r="10" fill="#C090F5" stroke="#C090F5" stroke-width="3"/>
<text x="894" y="156" class="d" fill="#F2F0F9" font-size="16" font-weight="700" text-anchor="middle">Admin + t3.small</text>
<text x="894" y="179" class="s" fill="#9E98B2" font-size="13" text-anchor="middle">Migration 0008, caps</text>
</g>
<g class="rise r5">
<text x="1090" y="82" class="m" fill="#9E98B2" font-size="12" font-weight="600" letter-spacing="1.2" text-anchor="middle">NEXT</text>

<circle cx="1090" cy="112" r="8" fill="#1A1725" stroke="#3A3350" stroke-width="3"/>
<text x="1090" y="156" class="d" fill="#F2F0F9" font-size="16" font-weight="700" text-anchor="middle">Stage 1 field</text>
<text x="1090" y="179" class="s" fill="#9E98B2" font-size="13" text-anchor="middle">Recordings, kiosk SKU</text>
</g>
</svg>
