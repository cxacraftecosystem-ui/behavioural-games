<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="40" viewBox="0 0 1200 40" role="img" aria-label="Section divider">
<title>Section divider</title>
<defs>
<style>.d{font-family:'Plus Jakarta Sans','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.s{font-family:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.m{font-family:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.glint{animation:glint 6s cubic-bezier(.5,0,.3,1) infinite}@keyframes glint{0%{transform:translateX(0)}70%,100%{transform:translateX(1500px)}}.spin{animation:spin 9s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.smil{display:none}.sweep{fill:url(#still)}}</style>
<linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#AA69E9" stop-opacity="0"/><stop offset=".5" stop-color="#AA69E9" stop-opacity=".7"/><stop offset="1" stop-color="#AA69E9" stop-opacity="0"/></linearGradient>
<linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#762CB1" stop-opacity="0"/><stop offset=".6" stop-color="#762CB1"/><stop offset="1" stop-color="#CD9200" stop-opacity="0"/></linearGradient>
<clipPath id="lane"><rect x="0" y="17" width="574" height="6"/><rect x="626" y="17" width="574" height="6"/></clipPath>
</defs>
<rect x="0" y="19.25" width="574" height="1.5" fill="url(#fade)"/>
<rect x="626" y="19.25" width="574" height="1.5" fill="url(#fade)"/>
<g clip-path="url(#lane)"><rect class="glint" x="-260" y="18.5" width="220" height="3" rx="1.5" fill="url(#gl)"/></g>
<circle cx="582" cy="20" r="2" fill="#AA69E9"/><circle cx="618" cy="20" r="2" fill="#AA69E9"/>
<g transform="rotate(45 600 20)"><rect class="spin" x="591" y="11" width="18" height="18" rx="3" fill="none" stroke="#E7D5FE" stroke-width="1.5"/></g>
<rect x="595" y="15" width="10" height="10" rx="2" fill="#762CB1" transform="rotate(45 600 20)"/>
</svg>
