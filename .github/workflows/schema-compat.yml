# Contract compatibility (PLT-02 policy, PLT-04 AC "an incompatible schema PR fails unless it bumps the major
# version and includes migration notes"). Compares contracts/schemas on the PR head with the merge base
# on main: breaking changes inside an existing *.vN.schema.json fail; forward changes (new enum values or event
# types) pass with a warning because the backend must deploy before kiosks send them.
name: Schema compatibility

on:
  pull_request:
    paths:
      - contracts/schemas/**
      - contracts/migrations/**
      - cicd/scripts/schema_compat.py
      - .github/workflows/schema-compat.yml
  push:
    branches: [main]
    paths:
      - contracts/schemas/**
  merge_group:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Git ref to compare against
        required: false
        default: origin/main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: schema-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compat:
    name: Backward / forward compatibility vs main
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: Resolve base revision
        id: base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.base_ref }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          BASE_REF_INPUT: ${{ inputs.base_ref || 'origin/main' }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="$(git merge-base "origin/${PR_BASE_REF}" HEAD)"
          elif [ "$EVENT" = "merge_group" ]; then
            base="$MERGE_GROUP_BASE"
          elif [ "$EVENT" = "push" ]; then
            base="$PUSH_BEFORE"
            # New branch or force push: 'before' is all zeros or no longer reachable; compare with the parent.
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then base="$(git rev-parse HEAD~1)"; fi
          else
            base="$(git rev-parse --verify "${BASE_REF_INPUT}^{commit}")"
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "Comparing against $base"
      - name: Extract base schemas
        run: |
          mkdir -p "$RUNNER_TEMP/base"
          # Schemas moved from packages/contracts/schemas to contracts/schemas in the repository restructure;
          # read whichever path the base commit has and normalise it to $RUNNER_TEMP/base/contracts/schemas.
          for p in contracts/schemas packages/contracts/schemas; do
            if git cat-file -e "${{ steps.base.outputs.sha }}:$p" 2>/dev/null; then
              git archive "${{ steps.base.outputs.sha }}" "$p" | tar -x -C "$RUNNER_TEMP/base"
              if [ "$p" != contracts/schemas ]; then
                mkdir -p "$RUNNER_TEMP/base/contracts" && mv "$RUNNER_TEMP/base/$p" "$RUNNER_TEMP/base/contracts/schemas"
              fi
              break
            fi
          done
          mkdir -p "$RUNNER_TEMP/base/contracts/schemas"
      - name: Compare
        id: compare
        run: |
          set +e
          python cicd/scripts/schema_compat.py \
            --base "$RUNNER_TEMP/base/contracts/schemas" \
            --head contracts/schemas \
            --migrations contracts/migrations \
            --out schema-compat.md
          status=$?
          cat schema-compat.md >> "$GITHUB_STEP_SUMMARY"
          python cicd/scripts/schema_compat.py \
            --base "$RUNNER_TEMP/base/contracts/schemas" \
            --head contracts/schemas \
            --migrations contracts/migrations --json > schema-compat.json
          if grep -q '"severity": "forward"' schema-compat.json; then
            echo "::warning title=Forward-incompatible contract change::Deploy the backend before any kiosk release that emits the new values (see job summary)."
          fi
          exit $status
      - name: Comment on the PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('schema-compat.md')) return;
            const body = '<!-- schema-compat -->\n' + fs.readFileSync('schema-compat.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body && c.body.startsWith('<!-- schema-compat -->'));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else if (!body.includes('No contract changes.')) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: schema-compat
          path: |
            schema-compat.md
            schema-compat.json
          if-no-files-found: ignore
