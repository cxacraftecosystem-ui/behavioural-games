# Dependency vulnerability scanning (PLT-04: osv-scanner) over pnpm-lock.yaml, uv.lock and container bases.
# PRs fail only on vulnerabilities newly introduced by the PR; the scheduled scan reports everything to
# code scanning.
name: OSV-Scanner

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-pr:
    name: New vulnerabilities in this PR
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36  # v2.7.0
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      scan-args: |-
        --recursive
        --lockfile=pnpm-lock.yaml
        --lockfile=uv.lock
        ./

  scan-scheduled:
    name: Full scan
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36  # v2.7.0
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      scan-args: |-
        --recursive
        --lockfile=pnpm-lock.yaml
        --lockfile=uv.lock
        ./
