# Backend container images -> GHCR (the EC2 deployment pulls these; see docs/deploy/aws-ec2.md).
#
#   ghcr.io/cxacraftecosystem-ui/behavioural-games-api:<sha>|latest     (infra/docker/api.Dockerfile, target api)
#   ghcr.io/cxacraftecosystem-ui/behavioural-games-worker:<sha>|latest  (infra/docker/api.Dockerfile, target worker)
#
# Built on every push to main and on demand. Pull requests build without pushing (the CI compose job
# already builds the same Dockerfile). Only GITHUB_TOKEN is used (packages: write).
name: Images

on:
  push:
    branches: [main]
    paths:
      - backend/api/**
      - contracts/**
      - stats/**
      - content/**
      - pyproject.toml
      - uv.lock
      - infra/docker/api.Dockerfile*
      - infra/docker/healthcheck.py
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/cxacraftecosystem-ui/behavioural-games

jobs:
  build:
    name: Image ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=behavioural-games-${{ matrix.image }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          target: ${{ matrix.image }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.image }}
      - name: Summary
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
