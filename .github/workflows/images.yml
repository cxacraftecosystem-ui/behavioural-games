# Backend container images -> GHCR (the EC2 deployment pulls these; see docs/deploy/aws-ec2.md).
#
#   ghcr.io/cxacraftecosystem-ui/behavioural-games-api:<sha>|latest     (infra/docker/api.Dockerfile, target api)
#   ghcr.io/cxacraftecosystem-ui/behavioural-games-worker:<sha>|latest  (infra/docker/api.Dockerfile, target worker)
#
# and mirrored to ECR (the EC2 instance pulls from there with its instance role, because GHCR packages under a
# personal account start private):
#   626159998512.dkr.ecr.ap-south-1.amazonaws.com/shriii/behavioural-games-{api,worker}:<sha>|latest
#
# Built on every push to main and on demand. GHCR uses GITHUB_TOKEN (packages: write); ECR uses GitHub OIDC
# into the role shriii-gha-ecr-push, which trusts only refs/heads/main of this repository
# (infra/ec2/provision-ecr.sh). No long-lived credentials.
name: Images

on:
  push:
    branches: [main]
    paths:
      - backend/api/**
      - contracts/**
      - stats/**
      - content/**
      - pyproject.toml
      - uv.lock
      - infra/docker/api.Dockerfile*
      - infra/docker/healthcheck.py
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/cxacraftecosystem-ui/behavioural-games
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 626159998512.dkr.ecr.ap-south-1.amazonaws.com
  ECR_PUSH_ROLE: arn:aws:iam::626159998512:role/shriii-gha-ecr-push

jobs:
  build:
    name: Image ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write # AWS OIDC (ECR push)
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aws-actions/configure-aws-credentials@v4
        if: github.ref == 'refs/heads/main'
        with:
          role-to-assume: ${{ env.ECR_PUSH_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        if: github.ref == 'refs/heads/main'
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
            name=${{ env.ECR_REGISTRY }}/shriii/behavioural-games-${{ matrix.image }},enable=${{ github.ref == 'refs/heads/main' }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=behavioural-games-${{ matrix.image }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          target: ${{ matrix.image }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.image }}
      - name: Summary
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
