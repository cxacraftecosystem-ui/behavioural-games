# Nightly full simulated-player parameter-recovery run (PLT-04: "small run per PR, full run nightly"; QA-02).
# Runs both pathways at n = 400 per run (Pathway B once per planned-missingness slot form) and publishes the
# per-indicator recovery table; the slow simulator/validation test suite (including its n = 400 recovery targets)
# is the blocking gate. The demo-pipeline job runs `shriii-api demo-pipeline` at full size against PostgreSQL 18
# (the per-PR CI runs the same code at a tiny size in the API test suite). Opens (or updates) a tracking issue on failure.
name: Nightly simulation

on:
  schedule:
    - cron: "17 20 * * *" # 01:47 IST
  workflow_dispatch:
    inputs:
      n:
        description: Simulated persons per run
        required: false
        default: "400"
      seed:
        description: Base seed
        required: false
        default: "11"
      demo_preset:
        description: "Demo pipeline size (full: 400 per language + 100 retests; fast: 120 + 40)"
        required: false
        default: full
        type: choice
        options: [full, fast]

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-sim
  cancel-in-progress: false

env:
  UV_FROZEN: "1"

jobs:
  recovery:
    name: Recovery (${{ matrix.pathway }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - pathway: A
            extra: ""
          - pathway: B
            extra: "--slot-forms"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --all-packages
      # The per-indicator table is a report: the blocking recovery targets are the ones the simulator test suite
      # asserts (slow-tests job). Indicators below sqrt(parallel reliability) - tolerance are annotated.
      - name: Parameter recovery
        env:
          SIM_N: ${{ inputs.n || '400' }}
          SIM_SEED: ${{ inputs.seed || '11' }}
        run: |
          [[ "$SIM_N" =~ ^[0-9]+$ && "$SIM_SEED" =~ ^[0-9]+$ ]] || { echo "::error::n and seed must be integers"; exit 1; }
          uv run python cicd/scripts/sim_recovery.py \
            --n "$SIM_N" --seed "$SIM_SEED" \
            --pathways ${{ matrix.pathway }} ${{ matrix.extra }} --out-dir "sim-recovery-${{ matrix.pathway }}" \
            --report-only
          failed=$(python3 -c "import json,glob; print(sum(json.load(open(f))['failed'] for f in glob.glob('sim-recovery-${{ matrix.pathway }}/recovery-*.json')))")
          if [ "$failed" -gt 0 ]; then
            echo "::warning title=Recovery below threshold::$failed indicator(s) in pathway ${{ matrix.pathway }} are below their recovery threshold (see summary)."
          fi
      - name: Summary
        if: always()
        run: cat "sim-recovery-${{ matrix.pathway }}/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: sim-recovery-${{ matrix.pathway }}
          path: sim-recovery-${{ matrix.pathway }}/
          retention-days: 30

  slow-tests:
    name: Slow simulator tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --all-packages
      - name: Slow statistical and recovery tests
        env:
          SHRIII_RUN_SLOW: "1"
        run: uv run pytest stats/simulator/tests stats/validation/tests -q

  demo-pipeline:
    # End-to-end demo against PostgreSQL 18: seed -> simulate 2 languages (planted DIF, retests, criterion
    # battery) -> POST /api/v1/events/batch -> scoring -> matching -> frozen snapshot -> every validation
    # analysis, a model with holdout, norms -> gate evaluation (evaluate-only; gates stay closed).
    name: Demo pipeline (${{ inputs.demo_preset || 'full' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: shriii
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dev -d shriii"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ENV: test
      AUTH_MODE: dev
      DEV_JWT_SECRET: nightly-demo-pipeline-secret-0123456789abcdef
      DATABASE_URL: postgresql+psycopg://dev:dev@localhost:5432/shriii
      DATA_DIR: ${{ github.workspace }}/demo-data
      LOG_JSON: "false"
      LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --all-packages
      - name: Demo pipeline
        env:
          DEMO_PRESET: ${{ inputs.demo_preset || 'full' }}
          SIM_SEED: ${{ inputs.seed || '11' }}
        run: |
          [[ "$SIM_SEED" =~ ^[0-9]+$ ]] || { echo "::error::seed must be an integer"; exit 1; }
          [[ "$DEMO_PRESET" =~ ^(full|fast)$ ]] || { echo "::error::unknown preset"; exit 1; }
          set -o pipefail
          uv run shriii-api demo-pipeline --preset "$DEMO_PRESET" --seed "$SIM_SEED" --workers 4 | tee demo-summary.txt
          if grep -q "planted_dif_recovered=FAIL" demo-summary.txt; then
            echo "::warning title=Planted DIF not recovered::the DIF planted in one indicator was not flagged (class B/C); see the summary."
          fi
      - name: Summary
        if: always()
        run: |
          { echo '### Demo pipeline'; echo '```'; cat demo-summary.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: demo-pipeline
          path: |
            demo-summary.txt
            demo-data/demo/
          retention-days: 30

  report:
    name: Track failures
    needs: [recovery, slow-tests, demo-pipeline]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const title = 'Nightly simulation failed';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'nightly-sim' });
            const existing = open.data.find((i) => i.title === title);
            const body = `Parameter recovery, slow simulator tests or the end-to-end demo pipeline failed: ${run}\n\nRecovery shows the pipeline is internally correct; a failure means a scoring, simulator or content change broke recovery (QA-02).`;
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: ['nightly-sim'] });
            }
