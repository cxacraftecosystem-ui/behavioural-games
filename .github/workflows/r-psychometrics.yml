# R psychometrics backend (VAL-01): build the pinned shriiipsy image (infra/docker/r-psychometrics.Dockerfile,
# renv-restored from a dated Posit Package Manager snapshot) with a BuildKit layer cache, run the testthat
# suite inside it, then run the stats/rbridge tests marked `r` against that image. The `r` tests skip
# themselves when no backend is available, so this job fails if any of them skipped.
# Runs when the R package, the bridge, the validation layer it implements, or the thresholds change, and on
# every push to main.
name: R psychometrics

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - stats/r-psychometrics/**
      - infra/docker/r-psychometrics.Dockerfile
      - stats/rbridge/**
      - stats/validation/**
      - stats/measurement-model/gates.yaml
      - "**/validation_params.yaml"
      - uv.lock
      - .github/workflows/r-psychometrics.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-psychometrics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_FROZEN: "1"
  PYTHON_VERSION: "3.14"
  R_IMAGE: shriii/r-psychometrics:0.1.0

jobs:
  r:
    name: shriiipsy image, testthat and R bridge tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build image (BuildKit cache in GitHub Actions cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: stats/r-psychometrics
          file: infra/docker/r-psychometrics.Dockerfile
          tags: ${{ env.R_IMAGE }}
          load: true
          push: false
          cache-from: type=gha,scope=r-psychometrics
          cache-to: type=gha,scope=r-psychometrics,mode=max
      - name: testthat suite (inside the image)
        run: docker run --rm --network none --entrypoint shriiipsy-test "$R_IMAGE"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-packages
      - name: R bridge tests (marked r) against the image
        env:
          SHRIII_R_RUNNER: docker
          SHRIII_R_IMAGE: ${{ env.R_IMAGE }}
        run: uv run pytest stats/rbridge/tests -m r -q --junitxml=r-bridge-report.xml
      - name: No R test may skip
        run: |
          python3 - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          suites = ET.parse("r-bridge-report.xml").getroot().iter("testsuite")
          tests = skipped = 0
          for s in suites:
              tests += int(s.get("tests", 0))
              skipped += int(s.get("skipped", 0))
          print(f"r-marked tests: {tests}, skipped: {skipped}")
          if tests == 0 or skipped:
              print("::error title=R bridge tests::R tests were skipped or none were collected")
              sys.exit(1)
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: r-bridge-report
          path: r-bridge-report.xml
          if-no-files-found: ignore
