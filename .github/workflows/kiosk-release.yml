# Kiosk release (PLT-04, KSK-11): deploy-order gate -> reproducible kiosk build (web bundle + Electron shell)
# -> CycloneDX SBOM -> cosign signatures -> GitHub release recording the app x content x dictionary tuple.
#
# Secrets (placeholders until the signing ceremony; the release fails closed without signing material):
#   COSIGN_PRIVATE_KEY, COSIGN_PASSWORD   key-pair signing (cosign generate-key-pair)
# Variables:
#   COSIGN_KEYLESS=true                   use Sigstore keyless signing instead (GitHub OIDC; public Rekor entry)
#   PRODUCTION_CONTRACTS_REF              git ref deployed to production (default: tag deployed/production)
#   KIOSK_API_BASE                        ingestion API origin compiled into the bundle (required for tag releases;
#                                         the Electron shell's SHRIII_API_ORIGIN must match it)
#   KIOSK_MODE / KIOSK_SITE_MODE          optional build-time session / site modes (defaults: public, supervised)
# Secrets (build configuration):
#   KIOSK_DEV_PIN                         operator PIN compiled into the bundle (4-8 digits; required for tag
#                                         releases, otherwise the app falls back to its well-known development PIN)
name: Kiosk release

on:
  push:
    tags: ["kiosk-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and sign-check only; do not publish a release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: kiosk-release-${{ github.ref }}
  cancel-in-progress: false

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  deploy-order:
    name: Deploy-order gate (kiosk contracts not ahead of production)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: Compare contracts with the production backend
        run: |
          ref="${{ vars.PRODUCTION_CONTRACTS_REF || 'deployed/production' }}"
          if ! git rev-parse -q --verify "$ref^{commit}" > /dev/null; then
            echo "::warning title=No production ref::'$ref' does not exist yet; skipping the deploy-order gate (first release)."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/prod"
          # Schemas moved from packages/contracts/schemas to contracts/schemas in the repository restructure;
          # read whichever path the production ref has.
          prod_schemas=contracts/schemas
          git cat-file -e "$ref:$prod_schemas" 2>/dev/null || prod_schemas=packages/contracts/schemas
          git archive "$ref" "$prod_schemas" | tar -x -C "$RUNNER_TEMP/prod"
          # A kiosk may not emit anything the production backend cannot read: forward changes fail here.
          set +e
          python cicd/scripts/schema_compat.py \
            --base "$RUNNER_TEMP/prod/$prod_schemas" --head contracts/schemas \
            --migrations contracts/migrations --fail-on forward --out deploy-order.md
          status=$?
          cat deploy-order.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

  build:
    name: Build kiosk artefacts
    needs: [deploy-order]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.meta.outputs.version }}
    # Job-level so the reproducibility rebuild sees exactly the same build-time configuration.
    env:
      VITE_API_BASE: ${{ vars.KIOSK_API_BASE }}
      VITE_KIOSK_MODE: ${{ vars.KIOSK_MODE || 'public' }}
      VITE_SITE_MODE: ${{ vars.KIOSK_SITE_MODE || 'supervised' }}
      VITE_DEV_PIN: ${{ secrets.KIOSK_DEV_PIN }}
      VITE_DEV_VOICE_PLACEHOLDER: "false"
      VITE_DEV_OVERLAY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Release configuration
        run: |
          missing=()
          [ -n "$VITE_API_BASE" ] || missing+=("vars.KIOSK_API_BASE")
          [[ "$VITE_DEV_PIN" =~ ^[0-9]{4,8}$ ]] || missing+=("secrets.KIOSK_DEV_PIN (4-8 digits)")
          if [ ${#missing[@]} -gt 0 ]; then
            if [[ "$GITHUB_REF" == refs/tags/kiosk-v* ]]; then
              echo "::error title=Kiosk release configuration::missing ${missing[*]}"; exit 1
            fi
            echo "::warning title=Kiosk release configuration::missing ${missing[*]} (tolerated for dry runs only)"
          fi
      - name: Release metadata (version tuple)
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/kiosk-v* ]]; then version="${GITHUB_REF#refs/tags/kiosk-v}"; else version="0.0.0-${GITHUB_SHA::12}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # GITHUB_ENV reaches later steps only; the tuple below needs the value in this one too.
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          node -e '
            const fs = require("fs");
            const yaml = (p) => { const m = fs.readFileSync(p, "utf8").match(/^version:\s*([^\s#]+)/m); return m ? m[1].replace(/[\x27"]/g, "") : null; };
            const tuple = {
              app_version: process.argv[1],
              commit: process.env.GITHUB_SHA,
              kiosk_package: require("./frontend/apps/kiosk/package.json").version,
              contracts_package: require("./contracts/package.json").version,
              content_session_plan: JSON.parse(fs.readFileSync("content/games/session-plan.json", "utf8")).version,
              scoring_dict_version: { A: yaml("stats/measurement-model/dictionary/dictionary.A.yaml"), B: yaml("stats/measurement-model/dictionary/dictionary.B.yaml"), shared: yaml("stats/measurement-model/dictionary/shared.yaml") },
              api_base: process.env.VITE_API_BASE || null,
              kiosk_mode: process.env.VITE_KIOSK_MODE,
              site_mode: process.env.VITE_SITE_MODE,
              built_at: new Date(Number(process.env.SOURCE_DATE_EPOCH) * 1000).toISOString(),
            };
            fs.writeFileSync("release-tuple.json", JSON.stringify(tuple, null, 2) + "\n");
          ' "$version"
          cat release-tuple.json
      - name: Build (web bundle + Electron main/preload)
        run: |
          pnpm --filter "@shriii/kiosk..." run build
          pnpm --filter @shriii/kiosk run electron:build
      - name: Reproducibility check (same commit, same web-asset hashes)
        run: |
          (cd frontend/apps/kiosk/dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > first.sha256
          rm -rf frontend/apps/kiosk/dist
          pnpm --filter @shriii/kiosk exec vite build > /dev/null
          (cd frontend/apps/kiosk/dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > second.sha256
          diff -u first.sha256 second.sha256
      - name: Package
        run: |
          v="${{ steps.meta.outputs.version }}"
          mkdir -p out
          tarit() { tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner -czf "$@"; }
          tarit "out/shriii-kiosk-web-$v.tar.gz" -C frontend/apps/kiosk/dist .
          mkdir -p stage/electron && cp -r frontend/apps/kiosk/electron/dist stage/electron/dist && cp -r frontend/apps/kiosk/dist stage/renderer
          cp frontend/apps/kiosk/package.json release-tuple.json stage/
          tarit "out/shriii-kiosk-electron-$v.tar.gz" -C stage .
          cp release-tuple.json out/
          (cd out && sha256sum -- * > SHA256SUMS)
          cat out/SHA256SUMS
      - name: CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: out/shriii-kiosk-${{ steps.meta.outputs.version }}.cdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: kiosk-release-unsigned
          path: out/
          retention-days: 14

  sign:
    name: Sign artefacts (cosign)
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # keyless signing only
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: kiosk-release-unsigned
          path: out
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Sign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_KEYLESS: ${{ vars.COSIGN_KEYLESS }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          cd out
          if [ -n "$COSIGN_PRIVATE_KEY" ]; then
            printf '%s' "$COSIGN_PRIVATE_KEY" > "$RUNNER_TEMP/cosign.key"
            for f in *.tar.gz *.cdx.json SHA256SUMS release-tuple.json; do
              cosign sign-blob --yes --key "$RUNNER_TEMP/cosign.key" --bundle "$f.sigstore.json" "$f"
            done
            rm -f "$RUNNER_TEMP/cosign.key"
          elif [ "$COSIGN_KEYLESS" = "true" ]; then
            for f in *.tar.gz *.cdx.json SHA256SUMS release-tuple.json; do
              cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            done
          elif [ "$DRY_RUN" = "true" ]; then
            echo "::warning title=Unsigned dry run::No COSIGN_PRIVATE_KEY and COSIGN_KEYLESS != true; artefacts left unsigned (dry run)."
          else
            echo "::error title=No signing material::Set COSIGN_PRIVATE_KEY/COSIGN_PASSWORD or COSIGN_KEYLESS=true. Releases fail closed."
            exit 1
          fi
          ls -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: kiosk-release
          path: out/
          retention-days: 90

  publish:
    name: Publish GitHub release
    needs: [build, sign]
    if: startsWith(github.ref, 'refs/tags/kiosk-v') && inputs.dry_run != true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: kiosk-release
          path: out
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          {
            echo "Kiosk release $VERSION."
            echo
            echo '```json'
            cat out/release-tuple.json
            echo '```'
            echo
            echo "Verify: \`cosign verify-blob --key cosign.pub --bundle <file>.sigstore.json <file>\` and \`sha256sum -c SHA256SUMS\`."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "Kiosk $VERSION" --notes-file notes.md --verify-tag
