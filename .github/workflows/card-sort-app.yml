# Criterion card-sort app (CRT-05, CRT-09): frontend/apps/card-sort-app.
# web:     lint, typecheck, unit tests (scoring worked examples, store, outbox, contract records),
#          production web bundle, Playwright smoke against `vite preview` (tablet viewport, IndexedDB).
# android: Capacitor Android project generated from the web bundle and an unsigned debug APK
#          (Gradle on ubuntu-latest). No signing material is used.
name: Card Sort App

on:
  push:
    branches: [main]
    paths:
      - frontend/apps/card-sort-app/**
      - contracts/**
      - .github/workflows/card-sort-app.yml
  pull_request:
    paths:
      - frontend/apps/card-sort-app/**
      - contracts/**
      - content/instruments/card-sort-criterion.yaml
      - backend/api/openapi.json
      - pnpm-lock.yaml
      - .github/workflows/card-sort-app.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: card-sort-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  web:
    name: Web bundle, unit tests and Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend/apps/card-sort-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Lint
        run: pnpm exec biome check frontend/apps/card-sort-app .github/workflows/card-sort-app.yml
        working-directory: .
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build web bundle
        run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: card-sort-web
          path: frontend/apps/card-sort-app/dist
          retention-days: 14
      - name: Install Chromium for Playwright
        # apt mirrors can stall indefinitely (one held this step for 40 min): bound each attempt.
        timeout-minutes: 20
        run: |
          for attempt in 1 2 3; do
            timeout -k 30 360 pnpm exec playwright install --with-deps chromium && exit 0
            echo "::warning::Playwright install attempt $attempt failed or stalled; retrying"
          done
          exit 1
      - name: Playwright smoke (web build)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: failure()
        with:
          name: card-sort-playwright-report
          path: |
            frontend/apps/card-sort-app/playwright-report
            frontend/apps/card-sort-app/test-results
          retention-days: 7

  android:
    name: Android debug APK (unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend/apps/card-sort-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6.4.1
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Build web bundle
        run: pnpm build
      - name: Generate the Capacitor Android project
        run: pnpm exec cap add android
      - name: Camera permission and no-backup manifest
        run: pnpm android:prepare
      - name: Sync web assets and plugins
        run: pnpm exec cap sync android
      - name: Assemble debug APK
        working-directory: frontend/apps/card-sort-app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Check the SQLite plugin is packaged
        working-directory: frontend/apps/card-sort-app/android
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          unzip -l "$apk" | grep -q 'assets/public/index.html'
          grep -q 'capacitor-community-sqlite' capacitor.settings.gradle
          ls -la "$apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: card-sort-app-debug-apk
          path: frontend/apps/card-sort-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
