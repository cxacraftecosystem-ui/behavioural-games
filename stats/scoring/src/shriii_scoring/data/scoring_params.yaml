# SHRIII indicator-engine parameters (layer 2) that are not (yet) fields of the frozen dictionary.
#
# Scientific thresholds never live in code. Values below that come from the plan or from the
# dictionary's formula descriptions cite their source. They are candidates for promotion into
# stats/measurement-model/dictionary/shared.yaml at the next dictionary amendment (status: draft, unfrozen).
schema: shriii-scoring-params
version: 0.1.0
status: draft

# Card sort / reversal reacquisition: "trials until 3 consecutive correct" (dictionary formula text,
# card_sort.trials_to_reacquire and reversal.trials_to_reacquire).
reacquisition:
  consecutive_correct: 3

# Stall feedback recovery: "accuracy on the 3 trials after negative feedback" (dictionary A).
feedback_recovery:
  window_trials: 3

# Tone choices are closed codes mapped to an ordinal (dictionary A: 0 firm, 1 neutral, 2 warm).
tone:
  ordinal:
    firm: 0
    neutral: 1
    warm: 2
  hostile_level_min: 3            # customer_tone_level >= this counts as a provocation (levels 0-4)
  min_distinct_levels_mirroring: 3  # EPI-01 AC: tone choices across >= 3 customer tone levels

# Response to partner defection is a ratio to the person's own baseline ("relative to the person's
# cooperative-partner baseline"); the smoothing constant (share units) keeps the ratio finite near zero.
public_goods:
  ratio_smoothing: 0.05

# Tower: "skipped as soon as the skip icon appeared" (dictionary B persistence.give_up).
tower:
  give_up_window_ms: 2000

# Private reports (group level only). High values for the over-report estimator; fair-die expectation
# follows from the set. TOST margin for an honest population (SCR-08 AC: within +-.03).
private_report:
  high_values: [5, 6]
  faces: 6
  honest_equivalence_margin: 0.03
  min_reports_per_participant: 1
  # Small-cell suppression: a group estimate over fewer participants is withheld (estimate null, flag
  # suppressed_small_group) so that it can never describe an identifiable individual (non-negotiable 6,
  # SCR-08). Mirrors gates.yaml quality.fairness_cell_min_n (VAL-16 suppression).
  min_group_participants: 30

# Relative variability index bounds (Mestdagh et al., 2018 need a bounded scale).
rvi:
  rt_lower_ms: 150                # anticipatory threshold (shared.yaml anticipatory_response)
  decision_time_upper_ms: 30000   # self-paced outlier ceiling (shared.yaml self_paced_outlier)
  inter_tap_upper_ms: 5000
  min_values: 5

# Persistence of response style (SCR-10). caution is proxied by within-segment RT variability because a
# diffusion boundary cannot be estimated from <= 4 probe trials per segment.
style:
  min_trials_per_segment: 2
  dimensions: [speed, rt_variability, revision_rate, risk]
  risky_codes: [risky]
  correlation_clip: 0.995

# Hierarchical / model-based estimation (batch model step).
models:
  partition_keys: [pathway, language, calibration_level]
  mixedlm_maxiter: 200
  min_persons: 20                 # fewer persons in a partition -> model not estimated (status model_failed)
  min_trials_per_cell: 2          # each person needs >= this many trials on each side of a contrast
  location_scale_min_trials: 10
  # Binary-outcome slopes (pressure accuracy): logistic_glmm (Laplace logistic mixed model, logit scale;
  # glmmTMB/glmer design in stats/r-psychometrics) or lpm (linear-probability REML model, the v0 method).
  # The LPM recovered the planted composure effect at r ~ .30 (B) because the near-ceiling go trials get
  # full weight; docs/science/indicator-review.md has the comparison.
  binary_outcome_model: logistic_glmm
  # Trial types entering the pressure-accuracy slope (trial type is a fixed effect when both are listed).
  pressure_accuracy_trial_types: [go, nogo]
  # Trial type (no-go = 1) as a fixed effect when both types enter (false reproduces the v0 model).
  pressure_accuracy_trial_type_effect: true
  # Stability shift slopes: null = every post-shift trial is "post" (v0); an integer keeps only the first
  # N trials after each context shift (early-window contrast). See docs/science/indicator-review.md.
  shift_window_trials: null

# Delay / effort discounting (hyperbolic, penalised likelihood with an empirical-Bayes population prior).
discounting:
  log_k_bounds: [-12.0, 4.0]
  log_beta_prior_mean: 2.0        # inverse temperature on value differences scaled to [0, 1]
  log_beta_prior_sd: 1.0
  log_beta_bounds: [-3.0, 5.0]
  initial_log_k_prior_mean: -3.0
  initial_log_k_prior_sd: 2.5
  eb_max_iter: 50
  eb_tol: 1.0e-4

# Road Home idle gaps: game config constraint idle_gap_log_ms is used when present; this is the fallback.
errands:
  idle_gap_fallback_ms: 3000

# Data-quality flag engine (SCR-12). Grades: usable | caution | exclude.
quality:
  careless:
    fast_rt_ms: 150               # RT < 150 ms runs
    fast_run_length: 5            # a run of >= 5 consecutive anticipatory responses
    fast_share_exclude: 0.30      # >= 30 % anticipatory responses -> exclude
    same_position_share: 0.90     # same position >= 90 %
    same_position_min_trials: 10
    position_grid: 3              # touch positions binned on a 3 x 3 grid of the safe area
    zero_variance_min_trials: 8
  walkaway:
    abandoned_grade: caution
  asr:
    low_confidence: 0.60
    low_confidence_share: 0.30
  device:
    timing_flag_share_caution: 0.05
    timing_flag_share_exclude: 0.25
    uncertified_profile_prefixes: [uncertified]
    # Test-only certified profiles (CI headless Chromium). They let CI produce real indicator values,
    # but such sessions are flagged `test_timing_profile` (caution: never valid for a player report)
    # and the API refuses them outside ENV=dev/test. Real SKUs stay uncertified until ENG-02 certifies them.
    test_profiles: [ci-headless-test]
  integrity:
    seq_gap_grade: caution
    duplicate_seq_grade: exclude
  # Flags that set each grade (any listed flag present -> that grade; exclude wins over caution).
  grades:
    exclude: [careless_fast_runs, careless_same_position, device_timing_exclude, seq_conflict]
    caution: [careless_zero_variance, walkaway, abandoned, asr_low_confidence, device_timing_caution,
              device_uncertified_timing, test_timing_profile, possible_assistance, repeat_play, seq_gap,
              module_incomplete]
  valid_for_validation_excludes: [exclude]
  valid_for_report_excludes: [exclude, caution]

# Layer 3 criterion scoring (CRT-04). Instrument structure (items, keys, subscales, prorating) lives in
# content/instruments/*.yaml; these entries cover what the instrument files describe only in notes.
criterion:
  # BFI-2-XS items are administered once as BFI-2-S items 1-15 (bfi2_xs / bfi2_s notes).
  shared_items:
    - {instrument: bfi2_xs, source: bfi2_s, numbers: [1, 15]}
  # Performance tasks: responses arrive as "<item_id>.<measure>"; each subscale maps to one measure.
  performance_measures:
    tol_board:
      excess_moves: {measure: moves, aggregate: excess_over_min_moves}
      initial_thinking_time: {measure: initial_thinking_time_s, aggregate: mean}
      solved_within_limit: {measure: solved_within_limit, aggregate: sum}
    card_sort_criterion:
      perseverative_errors: {measure: perseverative_errors, aggregate: value}
      categories_completed: {measure: categories_completed, aggregate: value}
  careless_policy: flag            # flag | exclude (exclude sets na_reason criterion_careless)

# Exclusion rules whose descriptions restrict them to latency aggregates ("excluded from latency /
# RT-based / decision-time indicators; still count where relevant"). When listed for an indicator these
# rules mask the trial's latency instead of dropping the trial, so accuracy-based parts of the same
# indicator (e.g. the EZ-diffusion proportion correct) still see the trial.
latency_only_exclusions: [timeout_latency, voice_latency, anticipatory_response, self_paced_outlier]

# Lag-1 autocorrelation: linear detrending uses two degrees of freedom, so segments shorter than this are
# only demeaned (the documented small-sample bias remains; compare persons, not to zero).
lag1:
  min_length_linear_detrend: 6
